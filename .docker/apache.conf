ServerName localhost

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
</Directory>

# Served: index.php, .app/assets and the videos. Everything else is private.
<DirectoryMatch "^/var/www/html/\.(cache|state|docker|git)(/|$)">
    Require all denied
</DirectoryMatch>
<DirectoryMatch "^/var/www/html/\.app/(lib|views|tg)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "^\.|\.(?i:ya?ml|conf|sh|md|env|log)$">
    Require all denied
</FilesMatch>

# Telegram module (the "tg" container). flushpackets: stream video bytes as they arrive.
# disablereuse: the tg server closes idle keep-alive connections, and reusing one of those
# made Apache answer 502. retry=0: never put the backend in an "error" state that answers
# 503 for the next 60 s after a single failure (e.g. while the container restarts).
ProxyPass        /tg/ http://tg:8080/ flushpackets=on timeout=300 disablereuse=on retry=0
ProxyPassReverse /tg/ http://tg:8080/
