ServerName localhost

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
</Directory>

# Served: index.php, .app/assets and the videos. Everything else is private.
<DirectoryMatch "^/var/www/html/\.(cache|docker|git)(/|$)">
    Require all denied
</DirectoryMatch>
<DirectoryMatch "^/var/www/html/\.app/(lib|views)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "^\.|\.(?i:ya?ml|conf|sh|md|env|log)$">
    Require all denied
</FilesMatch>
