services:
  player:
    build: ./.docker
    image: vid-player:latest
    container_name: vid-player
    ports:
      # Only reachable from this computer. Use "8015:80" to open it to the local network.
      - "127.0.0.1:8015:80"
    volumes:
      - ./:/var/www/html:ro
      - ./.docker/apache.conf:/etc/apache2/conf-enabled/zz-vid.conf:ro
      - ./.docker/php.ini:/usr/local/etc/php/conf.d/zz-vid.ini:ro
      # The video folder (data/), writable: the converter adds MP4s here and Hapus deletes.
      # Nothing is ever overwritten. Remove this line to keep the videos read-only.
      - ./data:/media
      # Thumbnails, loudness maps, previews and conversion jobs: all made again when needed, so
      # this folder can be deleted at any time.
      - ./.cache:/cache
      # What you did that can't be made again (videos marked as watched). Keep it; back it up.
      - ./.state:/state
    restart: unless-stopped

  # Telegram module: streams videos from channels you joined and saves them here.
  # Needs TG_API_ID / TG_API_HASH in .env (see .env.example). Not reachable from outside:
  # the player proxies /tg/* to it.
  tg:
    build: ./.app/tg
    image: vid-telegram:latest
    container_name: vid-telegram
    env_file:
      - path: .env
        required: false
    volumes:
      # "Simpan ke vid" downloads into the video folder.
      - ./data:/media
      - ./.app/tg/server.php:/app/server.php:ro
      # Telegram thumbnails are cached here (.cache/tg) after the first fetch.
      - ./.cache:/cache
      # Telegram login session = full access to your account. Kept in a Docker volume,
      # outside this folder, so it can never be served or committed.
      - tg-session:/session
    restart: unless-stopped

volumes:
  tg-session:
